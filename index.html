<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="SVIN — social links">
  <title>SVIN</title>

  <style>
    :root {
      --bg: #050505;
      --white: #f5f5f5;
      --muted: #8d8d8d;
      --border: rgba(255,255,255,.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(115deg, transparent 0 49.5%, rgba(255,255,255,.035) 49.6% 49.75%, transparent 49.85%),
        linear-gradient(25deg, transparent 0 74%, rgba(255,255,255,.025) 74.1% 74.22%, transparent 74.32%),
        var(--bg);
      background-size: 520px 520px, 700px 700px, auto;
      color: var(--white);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      overflow-x: hidden;
    }

    /* Subtle scattered line motif */
    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      opacity: .32;
      z-index: 0;
    }

    body::before {
      width: 180px;
      height: 1px;
      background: rgba(255,255,255,.18);
      top: 17%;
      left: -25px;
      transform: rotate(-28deg);
      box-shadow:
        65px 38px 0 rgba(255,255,255,.10),
        105px 210px 0 rgba(255,255,255,.08),
        45vw 18vh 0 rgba(255,255,255,.08),
        75vw 65vh 0 rgba(255,255,255,.10);
    }

    body::after {
      width: 130px;
      height: 1px;
      background: rgba(255,255,255,.14);
      right: -20px;
      bottom: 19%;
      transform: rotate(32deg);
      box-shadow:
        -85px -80px 0 rgba(255,255,255,.07),
        -180px 35px 0 rgba(255,255,255,.08),
        -55px -220px 0 rgba(255,255,255,.06);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .profile {
      margin-bottom: 34px;
    }

    .profile h1 {
      font-size: clamp(42px, 12vw, 62px);
      font-weight: 700;
      letter-spacing: 10px;
      margin-left: 10px;
    }

    .subtitle-line {
      width: 46px;
      height: 1px;
      background: var(--white);
      margin: 15px auto 0;
      opacity: .8;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 16px 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(10,10,10,.82);
      color: var(--white);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .7px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform .22s ease, border-color .22s ease,
                  background .22s ease, box-shadow .22s ease;
    }

    .link::before {
      content: "";
      position: absolute;
      left: -35%;
      top: 0;
      width: 25%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.10),
        transparent
      );
      transform: skewX(-20deg);
      transition: left .55s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.75);
      background: rgba(20,20,20,.95);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }

    .link:hover::before {
      left: 125%;
    }

    .link:active {
      transform: scale(.985);
    }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: lowercase;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 18px;
      }

      .profile {
        margin-bottom: 30px;
      }

      .link {
        min-height: 56px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .link,
      .link::before {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="profile">
      <h1>SVIN</h1>
      <div class="subtitle-line"></div>
    </header>

    <nav class="links" aria-label="Social links">
      <a
        class="link"
        href="https://www.tiktok.com/@by.svin?_r=1&_t=ZS-9A7mmyIxYue"
        target="_blank"
        rel="noopener noreferrer"
      >TikTok</a>

      <a
        class="link"
        href="https://www.instagram.com/by.svin?stkn=MWJ5dncwOWs5cXhtNA=="
        target="_blank"
        rel="noopener noreferrer"
      >Instagram</a>

      <a class="link" href="mailto:emailmesvin@gmail.com">SVIN</a>
    </nav>

    <footer>copyright SVIN</footer>
  </main>
</body>
</html>
